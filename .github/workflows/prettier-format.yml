name: Format source with Prettier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format source
        run: npx --yes prettier@3.6.2 --write "**/*.{ts,tsx,js,mjs,cjs,json,html,scss,css,md,yml,yaml}"
      - name: Commit formatting to main
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format source with Prettier'
            git push origin HEAD:main
          fi

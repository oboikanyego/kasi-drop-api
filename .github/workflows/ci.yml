name: API CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - name: Validate all catalogue photo URLs
        run: npx tsx scripts/audit-catalogue-images.ts

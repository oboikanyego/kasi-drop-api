services:
  - type: web
    name: kasi-drop-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: CLIENT_URL
        value: https://kasi-drop.netlify.app
      - key: MONGODB_URI
        sync: false # Required only when DEMO_MODE=false
      - key: MONGODB_DB_NAME
        value: kasidrop
      - key: JWT_SECRET
        sync: false # Mandatory when DEMO_MODE=false
      - key: SEED_DEMO_USERS
        value: 'false' # Optional controlled demo seeding; turn off after the first seed
      - key: SEED_DEMO_ADMIN_PASSWORD
        sync: false # Secret only when SEED_DEMO_USERS=true
      - key: SEED_DEMO_CUSTOMER_PASSWORD
        sync: false # Secret only when SEED_DEMO_USERS=true
      - key: PUBLIC_API_URL
        value: https://kasi-drop-api.onrender.com
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render; never commit the secret
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
